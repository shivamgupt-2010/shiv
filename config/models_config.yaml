# ShivAI Declarative Model Configuration Registry
# Configures the pool of models available to the Model Router.
# The Model Router ranks models dynamically using capability scoring, priority, and real-time health.

models:
  # --------------------------------------------------------------------------
  # Provider 1: OpenAI
  # --------------------------------------------------------------------------
  - id: openai_gpt4o
    provider: openai
    model: gpt-4o
    priority: 95
    capabilities:
      reasoning: true
      vision: true
      tools: true
      streaming: true
      coding: true
    context_limit: 128000
    max_output_tokens: 4096
    cost_tier: high
    status: active

